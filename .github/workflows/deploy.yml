name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: "publish"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: "Checkout latest state on server"
        shell: bash
        run: |
          ssh -F /dev/null cloudfest@cloudfest.buerk.tech "cd project/api-monitor ; git fetch --all ; git checkout main ; git pull --rebase"